name: Publish the PixelOS 17 SUSFS 2.4.0 kernel
on:
  push:
    branches: [pixelos17-susfs24-import]
    paths: [.github/workflows/import-pixelos17-susfs24.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bakasu
      - name: Apply and verify the prepared source diff
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = afa3160f8f08558d6ec75eb2d646421ab7cbc0f2
          git fetch --depth=1 origin "$GITHUB_SHA"
          git show FETCH_HEAD:pixelos17-susfs24-refresh.patch > "$RUNNER_TEMP/flame-susfs24.patch"
          printf '%s  %s\n' d1178d89c6bc74de9c05e58fea4bfb04f64665171b6d9f0415c84de9593eda54 "$RUNNER_TEMP/flame-susfs24.patch" | sha256sum --check
          git apply --index "$RUNNER_TEMP/flame-susfs24.patch"
          test "$(git write-tree)" = c79107d8e4f6d8198aa27ba21fac2daf0a9233a0
          PYTHONDONTWRITEBYTECODE=1 python3 ci/test_build.py
          git -c user.name='GitHub Actions' -c user.email='actions@github.com' commit -qm 'flame: refresh SUSFS UID filters after successful renames [skip ci]'
          git push origin HEAD:refs/heads/bakasu
